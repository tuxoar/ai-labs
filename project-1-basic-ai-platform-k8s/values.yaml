# Default values for basic-ai-platform.
# These defaults lean "safe/internal": no external exposure, generated secrets
# expected via -f values-secret.local.yaml. Use values-local.yaml for a laptop
# cluster or values-talos.yaml for the GitOps/Talos deployment.

# --- The external model server (Ollama/vLLM on the RTX 5080 box) --------------
# Addressed by IP directly — NO in-cluster Service. (A selector-less Service would
# need a hand-authored Endpoints/EndpointSlice, and ArgoCD here excludes both.)
# LiteLLM connects to localAi.baseUrl; Prometheus scrapes ip:9100/:9400 via a
# ScrapeConfig (existing kube-prom) or static targets (bundled prometheus).
aiServer:
  ip: "10.6.6.13"
  nodeExporterPort: 9100
  dcgmPort: 9400
# LiteLLM points here. Keep the host in sync with aiServer.ip; path ends in /v1.
localAi:
  baseUrl: "http://10.6.6.13:11434/v1"
  apiKey: "none"

# --- Secrets -----------------------------------------------------------------
# Three mutually-exclusive modes:
#   create=true            -> chart renders a Secret from .secrets.values (local/dev).
#                             Provide real values via a gitignored -f file; never commit them.
#   vault.enabled=true     -> chart renders SA + VaultAuth + VaultStaticSecret; VSO
#                             syncs the named Secret from Vault (Talos/prod).
#   existingSecret set     -> use a Secret you created out-of-band; chart renders neither.
#
# MANUAL SECRET (no Vault): when Vault isn't set up yet, create the Secret by hand
# and point the chart at it with existingSecret (also set create=false,
# vault.enabled=false, e.g. via values-manual-secret.yaml):
#
#   kubectl -n basic-ai-platform create secret generic basic-ai-platform-secrets \
#     --from-literal=postgresPassword="$(openssl rand -base64 32 | tr -d '\n/+=' | cut -c1-40)" \
#     --from-literal=litellmMasterKey="sk-$(openssl rand -base64 32 | tr -d '\n/+=' | cut -c1-40)" \
#     --from-literal=litellmSaltKey="$(openssl rand -hex 32)" \
#     --from-literal=webuiSecretKey="$(openssl rand -hex 32)" \
#     --from-literal=grafanaPassword="$(openssl rand -base64 24 | tr -d '\n/+=' | cut -c1-32)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# plus, after first install, the scoped virtual keys from scripts/provision-keys.sh
# (openwebuiApiKey, smokeTestApiKey — open-webui requires the former to start).
secrets:
  secretName: basic-ai-platform-secrets
  create: true
  existingSecret: ""
  # Filled in ONLY via a local -f override (see scripts/gen-secret-values.sh). Empty here on purpose.
  values:
    postgresPassword: ""
    litellmMasterKey: ""
    litellmSaltKey: ""
    webuiSecretKey: ""
    grafanaPassword: ""
    # Scoped LiteLLM virtual keys — minted by scripts/provision-keys.sh AFTER
    # first install (runtime state in LiteLLM's DB), then added here (create
    # mode) or written to Vault (vault mode). Optional: rendered only if set.
    openwebuiApiKey: ""
    smokeTestApiKey: ""
    # rag-pipeline: embed-only gateway key + the two Postgres role passwords
    # (rag_ingest / rag_read, created by rag-pipeline/migrations/apply-migrations.sh).
    openwebuiRagApiKey: ""
    ragIngestPassword: ""
    ragReadPassword: ""
  vault:
    enabled: false
    # KV-v2 mount + path holding the 5 keys above (same key names, camelCase).
    mount: secret
    path: basic-ai-platform
    role: basic-ai-platform
    refreshAfter: 60s

# --- Init containers (wait-for-deps) ------------------------------------------
# Shared by the litellm / open-webui initContainers. Digest-pinned and given
# explicit resources + a non-root context so policy (require-digests,
# require-resources, disallow-root) holds for EVERY container in the namespace.
init:
  image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 64Mi }
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: { drop: ["ALL"] }
    seccompProfile: { type: RuntimeDefault }

# --- Postgres (pgvector) -----------------------------------------------------
# Images are pinned tag@digest: the tag is for humans, the digest is the pin.
# Bump procedure: docker buildx imagetools inspect <repo:tag> | grep Digest
postgres:
  image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
  user: aiplat
  db: aiplat          # bootstrap DB; init SQL also creates litellm/openwebui/knowledge
  storage:
    size: 10Gi
    storageClassName: ""   # "" = cluster default; set to openebs-replicated on Talos
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  # Debian postgres runs as uid/gid 999; read-only root needs /var/run/postgresql
  # and /tmp as emptyDirs (wired in the template).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile: { type: RuntimeDefault }
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: { drop: ["ALL"] }

# --- Redis (LiteLLM response cache) ------------------------------------------
redis:
  image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
  storage:
    size: 2Gi
    storageClassName: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999          # alpine redis uid/gid
    runAsGroup: 999
    fsGroup: 999
    seccompProfile: { type: RuntimeDefault }
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: { drop: ["ALL"] }

# --- LiteLLM gateway ---------------------------------------------------------
litellm:
  image: ghcr.io/berriai/litellm:main-stable@sha256:468c25f35f3e5ec4e414974f00deab93337b1b4d9953cabcfd3722e59415f834
  port: 4000
  resources:
    # LiteLLM's baseline RSS is ~600Mi-1Gi and spikes higher on startup with a
    # large model_list + the prometheus callback + DB store, so 1Gi OOM-kills it.
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 2Gi }
  # ACCEPTED EXCEPTION (threat model): runs as root — the image regenerates the
  # prisma client into site-packages at startup when a database_url is set.
  # Stretch: migrate to BerriAI's non-root image variant. Everything else is
  # locked down: no privilege escalation, all capabilities dropped, seccomp.
  podSecurityContext:
    seccompProfile: { type: RuntimeDefault }
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false   # prisma generate writes at startup
    capabilities: { drop: ["ALL"] }

# --- Open WebUI --------------------------------------------------------------
openWebui:
  image: ghcr.io/open-webui/open-webui:v0.11.3@sha256:41daa0cf2561a5d4c8d1ff31ee2a98d93ab4d3ac2605cac69366ff6a3374a933
  storage:
    size: 5Gi
    storageClassName: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  # ACCEPTED EXCEPTION (threat model): runs as root — the image's startup
  # rewrites root-owned files under /app/backend/open_webui/static/ (favicon/
  # logo/css), so an arbitrary uid fails with EACCES (verified 2026-09-12).
  # Baseline hardening still applies: no privilege escalation, all
  # capabilities dropped, seccomp. Revisit if upstream ships a non-root image.
  podSecurityContext:
    fsGroup: 1000
    seccompProfile: { type: RuntimeDefault }
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false   # python writes tmp/cache paths outside the PVC
    capabilities: { drop: ["ALL"] }
  # RAG (Track A: external pgvector knowledge — see rag-pipeline/PLAN.md).
  # Only the query-embedding path is configured here; Open WebUI's INTERNAL
  # vector store / hybrid / chunking stay unused (our pipeline owns the data).
  # Requires the openwebuiRagApiKey secret key (provision-keys.sh).
  rag:
    enabled: false                  # values-talos: true
    embeddingModel: embed-nomic     # must match the collection's embedder
    embeddingBatchSize: "16"

# --- Observability -----------------------------------------------------------
# Two modes:
#   * Bundled (default): deploy our own Prometheus + Grafana (good for a laptop
#     cluster with no monitoring stack).
#   * Existing stack: set prometheus.enabled=false and grafana.enabled=false, then
#     turn on monitoring.serviceMonitors + monitoring.dashboards so an existing
#     kube-prometheus-stack scrapes LiteLLM/ai-server and imports the dashboard.
prometheus:
  enabled: true
  image: prom/prometheus:latest@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
  storage:
    size: 10Gi
    storageClassName: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534        # nobody — the image's default user
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile: { type: RuntimeDefault }
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: { drop: ["ALL"] }

# --- Grafana -----------------------------------------------------------------
grafana:
  enabled: true
  image: grafana/grafana:latest@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
  user: admin
  storage:
    size: 2Gi
    storageClassName: ""
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 472          # grafana — the image's default user
    runAsGroup: 472
    fsGroup: 472
    seccompProfile: { type: RuntimeDefault }
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true   # /tmp is an emptyDir in the template
    capabilities: { drop: ["ALL"] }

# --- Integration with an EXISTING kube-prometheus-stack ----------------------
# Only meaningful when the bundled prometheus/grafana above are disabled.
monitoring:
  serviceMonitors:
    # Emit a ServiceMonitor for LiteLLM (:4000/metrics). Your kube-prom-stack has
    # serviceMonitorSelectorNilUsesHelmValues=false, so it's scraped with no extra
    # label; add labels here only if you tighten that selector later.
    enabled: false
    interval: 15s
    labels: {}
  scrapeConfig:
    # Scrape the external ai-server (node_exporter :9100, dcgm :9400) via a
    # Prometheus-Operator ScrapeConfig with static IP targets — no Service needed.
    # scrapeConfigSelectorNilUsesHelmValues defaults true, so the Prometheus
    # selects ScrapeConfigs by `release: <helm release>`. selectorLabels must
    # match that release (the kube-prom-stack ArgoCD Application name).
    enabled: false
    selectorLabels:
      release: kube-prom-stack
  dashboards:
    # Render the LiteLLM dashboard as a ConfigMap the kube-prom Grafana sidecar
    # auto-imports. The sidecar watches its own namespace by default, so this
    # ConfigMap is placed in `namespace` (where Grafana runs), not the app namespace.
    enabled: false
    namespace: monitoring
    label: grafana_dashboard
    labelValue: "1"

# --- Network policy (CiliumNetworkPolicy) -------------------------------------
# Least-privilege pod networking; see templates/networkpolicies.yaml for the
# flow map. defaultDeny adds the namespace catch-all (no ingress, DNS-only
# egress for anything not covered by a component policy) — enable it as a
# SECOND step after verifying `hubble observe --verdict DROPPED` is quiet.
networkPolicy:
  enabled: false      # requires Cilium (CNP CRDs)
  defaultDeny: false

# --- Kyverno policies (require-digests, restrict-registries, resources, non-root)
# Namespaced Policy objects, rendered only when Kyverno's CRDs exist on the
# cluster (k8s-gitops applications/45-kyverno). Rollout: Audit -> clean
# policyreports -> Enforce.
kyverno:
  enabled: false
  validationFailureAction: Audit

# --- External access ---------------------------------------------------------
# service.type governs the "flat" exposure for laptop clusters (NodePort) vs
# internal-only (ClusterIP). Gateway API (Cilium) is the Talos path.
service:
  type: ClusterIP        # local overlay sets NodePort for open-webui/grafana

gateway:
  enabled: false
  className: cilium
  clusterIssuer: letsencrypt
  # Which UIs get an HTTPRoute. Prometheus/LiteLLM stay internal by default.
  hosts:
    openWebui: ""        # e.g. ai.nuahs.net
    grafana: ""          # e.g. grafana-ai.nuahs.net
