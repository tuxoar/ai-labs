# Talos / GitOps overlay — this is the file the ArgoCD Application references.
# Matches k8s-gitops conventions: openebs-replicated storage, Cilium Gateway API
# with cert-manager TLS on *.nuahs.net, and secrets synced from Vault via VSO.

# Replicated block storage for the stateful components we keep.
postgres:
  storage: { storageClassName: openebs-replicated, size: 20Gi }
redis:
  storage: { storageClassName: openebs-replicated, size: 2Gi }
openWebui:
  storage: { storageClassName: openebs-replicated, size: 10Gi }
  # RAG Track A: query embeddings through the gateway with the embed-only key
  # (rag-pipeline/PLAN.md). Needs openwebuiRagApiKey in Vault BEFORE sync.
  rag:
    enabled: true

# The cluster already runs kube-prometheus-stack, so don't deploy our own.
# Instead, hand LiteLLM/ai-server metrics + the dashboard to that stack.
prometheus:
  enabled: false
grafana:
  enabled: false
monitoring:
  serviceMonitors:
    enabled: true           # LiteLLM ServiceMonitor
  scrapeConfig:
    enabled: true           # ai-server node_exporter + dcgm, static IP targets
    # Must match the kube-prom-stack Helm release name (its Application name).
    selectorLabels:
      release: kube-prom-stack
  dashboards:
    enabled: true
    namespace: monitoring   # where the kube-prom Grafana + its sidecar run

# No NodePorts — external access is via the Gateway only. Only Open WebUI is
# exposed here; Grafana is the existing kube-prom instance (its own ingress).
service:
  type: ClusterIP

# Least-privilege CNPs. Rollout is two commits: allow-policies first
# (defaultDeny: false), then — after a Hubble DROPPED watch through a full
# chat + scrape cycle stays silent — flip defaultDeny to true.
networkPolicy:
  enabled: true
  defaultDeny: true   # enabled after a clean Hubble DROPPED watch (2026-09-12)

# Flip enabled to true ONLY after the k8s-gitops "kyverno" Application is
# Healthy (missing CRDs fail the sync). Then: Audit -> clean policyreports
# (~24h) -> validationFailureAction: Enforce.
kyverno:
  enabled: true    # 45-kyverno Healthy on cluster (2026-09-13)
  # Audit soak showed 0 FAIL across all workloads before the flip.
  validationFailureAction: Enforce

gateway:
  enabled: true
  className: cilium
  clusterIssuer: letsencrypt
  hosts:
    openWebui: ai.nuahs.net
    grafana: ""

# Secrets come from Vault (nothing sensitive committed to git). Populate the KV
# path basic-ai-platform with keys: postgresPassword, litellmMasterKey,
# litellmSaltKey, webuiSecretKey, grafanaPassword (+ the provisioned virtual
# keys and rag role passwords — see values.yaml secrets.values comments).
secrets:
  create: false
  vault:
    enabled: true
    mount: secret
    path: basic-ai-platform
    role: basic-ai-platform
    refreshAfter: 60s
