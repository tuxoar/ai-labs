# Corpus manifest — copy to manifest.yaml (GITIGNORED: book titles and files
# stay out of the public repo) and edit. Each variant = one collection; the
# eval matrix and webui-setup are driven from these names.
books:
  - path: corpus/example-book-1.epub
  - path: corpus/example-book-2.epub

variants:
  # Baseline: nomic, fixed-ish paragraph packing at 1000 chars.
  - collection: lib-nomic-1000
    params: { embedder: [embed-nomic], chunk_size: 1000, chunk_overlap: 100 }

  # Ablation (a): contextual chunk headers.
  - collection: lib-nomic-1000-ctx
    params: { embedder: [embed-nomic], chunk_size: 1000, chunk_overlap: 100, contextual_headers: true }

  # Embedder A/B: bge-m3 on the same chunking (fills emb_bgem3 on new rows in
  # its own collection so retrieval comparisons stay clean).
  - collection: lib-bgem3-1000
    params: { embedder: [embed-bge-m3], chunk_size: 1000, chunk_overlap: 100 }

  # Phase 3 — hierarchy-aware variants (post-migration-005): packing stops at
  # SECTION boundaries and every chunk carries section_id, which enables the
  # "+ parent expansion" ablation row. Same embedders/sizes as the baselines
  # so the only difference measured is the structural split.
  - collection: lib-nomic-1000-h
    params: { embedder: [embed-nomic], chunk_size: 1000, chunk_overlap: 100, split: section }
  - collection: lib-nomic-1000-ctx-h
    params: { embedder: [embed-nomic], chunk_size: 1000, chunk_overlap: 100, split: section, contextual_headers: true }
  - collection: lib-bgem3-1000-h
    params: { embedder: [embed-bge-m3], chunk_size: 1000, chunk_overlap: 100, split: section }
