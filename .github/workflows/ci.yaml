name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform
      - name: Validate chart (lint + template + kubeconform + config parity)
        run: ./project-1-basic-ai-platform-k8s/scripts/ci-validate.sh

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate throwaway .env and validate compose file
        working-directory: project-1-basic-ai-platform
        run: |
          ./scripts/gen-env.sh
          docker compose config -q

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck all scripts
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          shellcheck --severity=warning \
                     project-1-basic-ai-platform/scripts/*.sh \
                     project-1-basic-ai-platform-k8s/scripts/*.sh

  trivy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy config scan (compose + rendered manifests)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

  # SBOM + CRITICAL-vuln gate for every pinned image. The image list is parsed
  # from values.yaml so the pins stay the single source of truth.
  trivy-images-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install trivy
        run: |
          curl -sSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin
      - name: SBOMs (CycloneDX) + CRITICAL gate
        run: |
          mkdir -p sboms
          images=$(python3 -c "
          import yaml
          v = yaml.safe_load(open('project-1-basic-ai-platform-k8s/values.yaml'))
          imgs = [v[c]['image'] for c in ('postgres','redis','litellm','openWebui','prometheus','grafana')]
          imgs.append(v['init']['image'])
          if v.get('ragApi', {}).get('image'):      # our own image, once published + pinned
              imgs.append(v['ragApi']['image'])
          print('\n'.join(imgs))")
          rc=0
          while IFS= read -r img; do
            name=$(echo "$img" | sed 's|.*/||; s|[:@].*||')
            echo "=== $img"
            trivy image --format cyclonedx --output "sboms/${name}.cdx.json" "$img"
            trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 --ignorefile .trivyignore "$img" || rc=1
          done <<< "$images"
          exit $rc
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sboms
          path: sboms/

  # Only LiteLLM publishes cosign signatures upstream (none of the other six
  # images sign). They sign with a KEY, not keyless OIDC — the public key is
  # vendored at project-1-basic-ai-platform-k8s/keys/berriai-cosign.pub
  # (pinned in-repo so CI does not trust their main branch at runtime).
  cosign-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Verify LiteLLM image signature (vendored public key)
        run: |
          img=$(python3 -c "
          import yaml
          print(yaml.safe_load(open('project-1-basic-ai-platform-k8s/values.yaml'))['litellm']['image'])")
          cosign verify --key project-1-basic-ai-platform-k8s/keys/berriai-cosign.pub "$img"

  # rag-pipeline: unit tests (parser/chunker hierarchy, retrieval SQL builder,
  # rag-api auth + bounds). No database or corpus needed.
  rag-pipeline-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0   # no moving v10 tag
      - name: pytest
        working-directory: rag-pipeline
        run: |
          uv sync --extra api --group dev
          uv run pytest -q

  # rag-api image: built from rag-pipeline/ and pushed to ghcr.io/tuxoar/rag-api
  # on main. The published digest is printed in the job summary; pin it in
  # project-1-basic-ai-platform-k8s/values.yaml (ragApi.image) in a follow-up
  # commit — Kyverno require-digests + the Trivy gate then cover it like every
  # other image. PRs only build (no push) to prove the Dockerfile.
  rag-api-image:
    needs: [rag-pipeline-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: rag-pipeline
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/tuxoar/rag-api:sha-${{ github.sha }}
            ghcr.io/tuxoar/rag-api:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
      - name: Scan the built image (CRITICAL gate, same policy as the pinned images)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/tuxoar/rag-api:sha-${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
      - name: Publish digest
        if: github.event_name != 'pull_request'
        run: |
          echo "### rag-api image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/tuxoar/rag-api:sha-${GITHUB_SHA}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # Placeholder: the smoke tests need the Talos cluster + GPU box, so they stay
  # out of hosted CI. This is also the hook point for the Month-2 red-team
  # harness (prompt-injection regression suite: attack corpus vs the gateway,
  # reporting attack success rate per model/guardrail config).
  smoke-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: echo "run scripts/smoke-test.sh against a reachable cluster"
